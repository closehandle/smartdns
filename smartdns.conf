server-name SmartDNS
resolv-hostname no
conf-file /run/smartdns/bind.conf
tcp-idle-time 30
cache-size 4194304
cache-persist no
cache-mem-size 134217728
serve-expired yes
serve-expired-ttl 259200
serve-expired-reply-ttl 3
serve-expired-prefetch-time 86400
prefetch-domain yes
speed-check-mode none
dualstack-ip-selection no
rr-ttl 0
rr-ttl-min 0
rr-ttl-max 86400
rr-ttl-reply-max 86400
response-mode fastest-response
log-console yes
log-level fatal
log-file /dev/null
log-num 0
audit-console yes
audit-enable yes
audit-syslog no
audit-file /dev/null
audit-num 0
ca-file /etc/ssl/certs/ca-certificates.crt
ca-path /etc/ssl/certs

conf-file /run/smartdns/bootdns.conf
conf-file /run/smartdns/chinadns.conf
conf-file /run/smartdns/otherdns.conf

domain-set -name chinadns -type list -file /etc/smartdns/chinadns.list
domain-rules /domain-set:chinadns/ -n chinadns -c ping,tcp:80 -r first-ping

conf-file /run/smartdns/additional.conf
